apply plugin: 'com.android.application'

// Signing key for updates. An in-app update only installs if the new APK is signed with the SAME key as the installed app.
// To keep that true on every machine, put the SAME keystore in use for your existing installs into android/keystore.properties
// (never commit it; see docs/APK_SIGNING_COMPATIBILITY.md). Without that file Gradle keeps its normal behaviour.
def keystorePropsFile = rootProject.file('keystore.properties')
def keystoreProps = new Properties()
if (keystorePropsFile.exists()) {
    keystorePropsFile.withInputStream { keystoreProps.load(it) }
    ['storeFile', 'storePassword', 'keyAlias', 'keyPassword'].each { key ->
        if (!keystoreProps.getProperty(key)) {
            throw new GradleException("android/keystore.properties is missing '" + key + "'.")
        }
    }
}

def releaseRequested = gradle.startParameter.taskNames.any { it.toLowerCase().contains('release') }
def buildName = System.getenv('MELK_VERSION_NAME') ?: '1.2.1'
def buildCode = System.getenv('MELK_VERSION_CODE') ?: '10201'
if (!(buildName ==~ /\d+\.\d+\.\d+/) || !(buildCode ==~ /[1-9]\d*/) || buildCode.toBigInteger() > 2147483647) {
    throw new GradleException('Invalid build version inputs.')
}
if (releaseRequested && !keystorePropsFile.exists()) {
    throw new GradleException('Release signing is required. Enroll the permanent keystore; release builds never use a random debug key.')
}

android {
    namespace = "com.bleled.com"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.bleled.com"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode buildCode.toInteger()
        versionName buildName
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        if (keystorePropsFile.exists()) {
            melk {
                storeFile rootProject.file(keystoreProps.getProperty('storeFile'))
                storePassword keystoreProps.getProperty('storePassword')
                keyAlias keystoreProps.getProperty('keyAlias')
                keyPassword keystoreProps.getProperty('keyPassword')
            }
        }
    }
    buildTypes {
        debug {
            // CI diagnostic only: separate package, so the user's installed app is untouched.
            if (project.hasProperty('melkPanelSideBySide') && project.property('melkPanelSideBySide') == 'true') {
                applicationIdSuffix '.paneldiag'
            }
            if (keystorePropsFile.exists()) signingConfig signingConfigs.melk
        }
        release {
            if (keystorePropsFile.exists()) signingConfig signingConfigs.melk
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
    // The downloader's loopback HTTP server uses JDK-only APIs, so its unchanged
    // integration tests run in :host-tests rather than Android's reduced JDK image.
    sourceSets { test.java.exclude '**/ApkDownloaderTest.java' }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
