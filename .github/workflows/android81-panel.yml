name: Android 8.1 panel diagnostics CI
on:
  push:
    branches: [fix/android81-panel-bootstrap]
  pull_request:
    paths:
      - 'www/**'
      - 'tests/**'
      - '.github/workflows/android81-panel.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  panel:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - run: npm ci && npm test && npm run test:tools
      - run: npx cap sync android
      - name: Build Android 8.1 diagnostic APK
        run: bash android/gradlew -p android :app:assembleDebug :app:testDebugUnitTest :app:lintDebug -PmelkPanelSideBySide=true --no-daemon
      - name: Confirm APK API level and architecture
        run: |
          APK=android/app/build/outputs/apk/debug/app-debug.apk
          test -f "$APK"
          AAPT="$(find "$ANDROID_HOME/build-tools" -name aapt | sort -V | tail -1)"
          "$AAPT" dump badging "$APK" | tee android81-apk-badging.txt
          grep -q "sdkVersion:'24'" android81-apk-badging.txt
          grep -q "package: name='com.bleled.com.paneldiag'" android81-apk-badging.txt
      - uses: actions/upload-artifact@v4
        with:
          name: Android81-SIDE-BY-SIDE-DIAGNOSTIC-APK-${{ github.run_id }}
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android81-apk-badging.txt
          retention-days: 14
